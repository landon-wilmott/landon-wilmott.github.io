<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#002E5D" />
      <stop offset="55%" stop-color="#0a3d62" />
      <stop offset="100%" stop-color="#1e5799" />
    </linearGradient>
    <linearGradient id="traceGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#4ade80" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Card Background -->
  <rect x="20" y="20" width="560" height="440" rx="24" fill="url(#bgGrad)" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.4" />

  <!-- Subtle Grid -->
  <g stroke="#ffffff" stroke-opacity="0.06" stroke-width="1">
    <line x1="60" y1="20" x2="60" y2="460" />
    <line x1="120" y1="20" x2="120" y2="460" />
    <line x1="180" y1="20" x2="180" y2="460" />
    <line x1="240" y1="20" x2="240" y2="460" />
    <line x1="300" y1="20" x2="300" y2="460" />
    <line x1="360" y1="20" x2="360" y2="460" />
    <line x1="420" y1="20" x2="420" y2="460" />
    <line x1="480" y1="20" x2="480" y2="460" />
    <line x1="540" y1="20" x2="540" y2="460" />
    <line x1="20" y1="80" x2="580" y2="80" />
    <line x1="20" y1="140" x2="580" y2="140" />
    <line x1="20" y1="200" x2="580" y2="200" />
    <line x1="20" y1="260" x2="580" y2="260" />
    <line x1="20" y1="320" x2="580" y2="320" />
    <line x1="20" y1="380" x2="580" y2="380" />
  </g>

  <!-- Header Banner inside graphic -->
  <rect x="45" y="45" width="510" height="52" rx="10" fill="#0f172a" fill-opacity="0.65" stroke="#38bdf8" stroke-opacity="0.35" />
  <circle cx="70" cy="71" r="7" fill="#ef4444" />
  <circle cx="92" cy="71" r="7" fill="#f59e0b" />
  <circle cx="114" cy="71" r="7" fill="#22c55e" />
  <text x="145" y="76" fill="#e2e8f0" font-family="monospace" font-size="15" font-weight="bold">BYU EC EN 340 // ANALOG &amp; SECURITY INFRASTRUCTURE</text>

  <!-- Schematic Op-Amp + Bandpass Graphic -->
  <g stroke="url(#traceGrad)" stroke-width="3" fill="none" filter="url(#glow)">
    <!-- Input line + Resistor zigzag -->
    <path d="M 60 220 L 105 220 L 112 208 L 124 232 L 136 208 L 148 232 L 160 208 L 167 220 L 205 220" />
    <!-- Input Capacitor -->
    <line x1="205" y1="198" x2="205" y2="242" stroke="#38bdf8" stroke-width="4" />
    <line x1="217" y1="198" x2="217" y2="242" stroke="#38bdf8" stroke-width="4" />
    <line x1="217" y1="220" x2="260" y2="220" />

    <!-- Op-Amp Triangle -->
    <polygon points="260,185 260,295 365,240" fill="#0f172a" fill-opacity="0.8" stroke="#38bdf8" stroke-width="3.5" />
    <!-- Op-Amp + and - signs -->
    <line x1="272" y1="215" x2="286" y2="215" stroke="#f87171" stroke-width="2.5" />
    <line x1="272" y1="265" x2="286" y2="265" stroke="#4ade80" stroke-width="2.5" />
    <line x1="279" y1="258" x2="279" y2="272" stroke="#4ade80" stroke-width="2.5" />

    <!-- Virtual Ground Biasing on + input -->
    <polyline points="260,265 230,265 230,315" />
    <line x1="214" y1="315" x2="246" y2="315" />
    <line x1="220" y1="323" x2="240" y2="323" />
    <line x1="226" y1="331" x2="234" y2="331" />

    <!-- Feedback network -->
    <polyline points="240,220 240,145 285,145" />
    <path d="M 285 145 L 292 135 L 304 155 L 316 135 L 328 155 L 335 145 L 390 145 L 390 240" />

    <!-- Output wave -->
    <line x1="365" y1="240" x2="425" y2="240" />
    <path d="M 435 240 Q 452 180 470 240 T 505 240 T 540 240" stroke="#4ade80" stroke-width="3.5" />
  </g>

  <!-- Node Badges -->
  <g font-family="monospace" font-size="13" fill="#bae6fd">
    <text x="65" y="195">f_L = 1 kHz</text>
    <text x="275" y="125">A_v = 60 dB / stage</text>
    <text x="430" y="190" fill="#86efac">Passband: 1.25–3.67 kHz</text>
    <text x="175" y="355" fill="#fcd34d">Virtual GND: +4.5V / ±1.65V</text>
  </g>

  <!-- Bottom Pill Badges -->
  <rect x="45" y="385" width="155" height="42" rx="8" fill="#0f172a" fill-opacity="0.75" stroke="#38bdf8" stroke-opacity="0.5" />
  <text x="122" y="411" text-anchor="middle" fill="#38bdf8" font-family="sans-serif" font-size="13" font-weight="bold">CompTIA Sec+ / Net+</text>

  <rect x="218" y="385" width="165" height="42" rx="8" fill="#0f172a" fill-opacity="0.75" stroke="#4ade80" stroke-opacity="0.5" />
  <text x="300" y="411" text-anchor="middle" fill="#4ade80" font-family="sans-serif" font-size="13" font-weight="bold">4 EC EN 340 Artifacts</text>

  <rect x="400" y="385" width="155" height="42" rx="8" fill="#0f172a" fill-opacity="0.75" stroke="#fcd34d" stroke-opacity="0.5" />
  <text x="477" y="411" text-anchor="middle" fill="#fcd34d" font-family="sans-serif" font-size="13" font-weight="bold">BYU Aims Aligned</text>
</svg>
